name: Pylint

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pylint

      - name: Run pylint
        run: |
          # tests/ is left out on purpose: pytest fixtures (redefined names, unused arguments)
          # trip pylint by design; flake8 in the "Python application" workflow still checks them
          pylint $(git ls-files '*.py' ':!tests') \
            --disable=C0114,C0115,C0116 \
            --disable=R0903,R0912,R0913,R0914,R0915 \
            --disable=W0703,W0719 \
            --fail-under=7.0
