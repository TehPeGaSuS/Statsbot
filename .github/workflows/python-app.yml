name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

# a newer push to the same branch/PR makes the older run pointless
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false            # see every Python version that breaks, not just the first
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt flake8

      - name: Lint with flake8
        run: |
          # fail on syntax errors or undefined names (tests included)
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Test
        run: |
          # every test gets its own temporary SQLite file: no data/ directory is touched
          python -m pytest -ra -q
